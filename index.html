<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示 | 宏恩資訊科技</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            /* 調整版面主題色彩 */
            --header-footer-bg: #2d1b4e; /* 深紫色背景 */
            --main-bg: #1e1e1e; /* 柔和的黑 */
            --text-light: #ffffff; /* 白色文字 */
            --link-hover: #d1b3ff; /* 連結滑過時的淺紫色 */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--main-bg);
        }

        /* 頂部與底部共用深紫背景與白字 */
        header, footer {
            background-color: var(--header-footer-bg);
            color: var(--text-light);
        }

        header {
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text-light);
        }

        .brand img {
            height: 45px; 
            width: auto;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        main {
            flex-grow: 1;
            position: relative;
            background-color: var(--main-bg); /* 中間展示區柔和的黑 */
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        footer {
            padding: 20px 30px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            z-index: 10;
        }

        .contact-info {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 將聯絡資訊的連結也改為白色 */
        .contact-item a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .contact-item a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .copyright {
            color: #aaaaaa;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px;
                justify-content: center;
            }
            .brand h1 {
                font-size: 1.25rem;
            }
            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .contact-info {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="https://www.hongentec.com/" class="brand" target="_blank">
            <img src="Logo.png" alt="宏恩資訊科技 Logo" onerror="this.style.display='none'">
            <h1>宏恩資訊科技</h1>
        </a>
    </header>

    <main>
        <!-- 修改 orientation 屬性來轉正模型 (X Y Z) -->
        <model-viewer 
            src="UHF-6-5-2.glb" 
            alt="宏恩資訊科技 3D 產品展示"
            auto-rotate 
            camera-controls 
            ar 
            shadow-intensity="1"
            orientation="0 -95deg 0">
        </model-viewer>
    </main>

    <footer>
        <div class="contact-info">
            <div class="contact-item">
                📞 <a href="tel:0937493902">0937-493-902</a>
            </div>
            <div class="contact-item">
                ✉️ <a href="mailto:sales.team@hongentec.com">sales.team@hongentec.com</a>
            </div>
            <div class="contact-item">
                📍 新竹市東區高峰里高翠路162巷55弄9號
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 HongEn. All Rights Reserved.
        </div>
    </footer>

</body>
</html>
