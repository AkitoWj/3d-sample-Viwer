<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示 | 宏恩資訊科技</title>
    
    <!-- 引入 Google <model-viewer> 元件 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            /* 你可以將這裡的顏色換成公司的企業識別色 */
            --primary-color: #0056b3; 
            --bg-color: #f8f9fa;
            --text-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 頂部導覽列 (Logo 與公司名稱) */
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text-color);
        }

        /* Logo 圖片大小設定 */
        .brand img {
            height: 45px; 
            width: auto;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* 3D 模型展示主區域 */
        main {
            flex-grow: 1;
            position: relative;
            /* 給模型一個稍微對比的底色，讓物件更突出 */
            background-color: #e9ecef; 
        }

        model-viewer {
            width: 100%;
            height: 100%;
            /* 隱藏載入前的預設海報背景 */
            --poster-color: transparent;
        }

        /* 底部聯絡資訊 */
        footer {
            background-color: #ffffff;
            padding: 20px 30px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            z-index: 10;
        }

        .contact-info {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        /* 手機版響應式設計 */
        @media (max-width: 768px) {
            header {
                padding: 15px;
                justify-content: center;
            }
            .brand h1 {
                font-size: 1.25rem;
            }
            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .contact-info {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- 頁首：Logo 與公司名稱 -->
    <header>
        <a href="https://www.hongentec.com/" class="brand" target="_blank">
            <!-- 請將 Logo.png 替換成你公司實際的 Logo 圖檔路徑 -->
            <img src="Logo.png" alt="宏恩資訊科技 Logo" onerror="this.style.display='none'">
            <h1>宏恩資訊科技</h1>
        </a>
    </header>

    <!-- 主內容區：3D 模型展示 -->
    <main>
        <!-- 
          src: 替換為你的 .glb 模型檔案
          auto-rotate: 讓模型自動緩慢旋轉
          camera-controls: 允許客戶用滑鼠/手指控制視角與縮放
          ar: 在支援的設備(手機)上顯示 AR 擴增實境按鈕
          shadow-intensity: 產生底部陰影增加真實感
        -->
        <model-viewer 
            src="UHF-6-5-2.glb" 
            alt="宏恩資訊科技 3D 產品展示"
            auto-rotate 
            camera-controls 
            ar 
            shadow-intensity="1">
        </model-viewer>
    </main>

    <!-- 頁尾：聯絡資訊 -->
    <footer>
        <div class="contact-info">
            <div class="contact-item">
                📞 <a href="tel:0937493902">0937-493-902</a>
            </div>
            <div class="contact-item">
                ✉️ <a href="mailto:sales.team@hongentec.com">sales.team@hongentec.com</a>
            </div>
            <div class="contact-item">
                📍 新竹市東區高峰里高翠路162巷55弄9號
            </div>
        </div>
        <div style="color: #888;">
            &copy; 2026 HongEn. All Rights Reserved.
        </div>
    </footer>

</body>
</html>
